# Terminal and title policy not covered by Home Manager's tmux options.
set -ga terminal-overrides ",xterm-*:Tc"
set -g xterm-keys on
set -g set-titles on
set -g set-titles-string 'tmux[#S/#W(#T)]'

# Compact status bar. This keeps the old high-signal layout without preserving
# every Dotter-era variable and comment.
set -g status-position top
set -g status-style 'bg=black,fg=colour230'
set -g status-interval 5
set -g status-left-length 90
set -g status-right-length 60
set -g status-justify left
set -g status-left '#[fg=colour14]#[fg=White] '
set -g status-right '#[fg=Cyan]#S #[fg=White]%a %d %b %R [#(hostname)]'
set -wg window-status-format '#[fg=default,bg=default] #I:#W '
set -wg window-status-current-format '#[fg=black,bg=white] #I:#W '

# F12 temporarily disables the prefix and makes the status bar obvious. This is
# useful when nested tools need raw keys.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'bg=red,fg=white' \;\
  set status-left '#[fg=White]#[fg=black] ' \;\
  set status-right '#[fg=black]#S%a %d %b %R [#(hostname)]' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u status-left \;\
  set -u status-right \;\
  refresh-client -S

# Copy mode follows vim muscle memory. The old config had the `copy-modj-vi`
# key table typo for `y`; this migration keeps the intended binding.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi WheelUpPane send -N 2 -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send -N 2 -X scroll-down
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x

# Navigation, splitting, zooming, and moving panes/windows. New panes and
# windows inherit the current pane directory.
bind R move-window -r
bind-key -n F1 select-pane -t :.+
bind-key -n S-F1 select-pane -t :.-
bind-key Tab select-window -t :.+
bind-key S-Tab select-window -t :.-
bind-key -n F2 resize-pane -Z
bind-key C-j select-pane -D
bind-key C-k select-pane -U
bind-key C-h select-pane -L
bind-key C-l select-pane -R
bind-key Down resize-pane -D 5
bind-key Up resize-pane -U 5
bind-key Left resize-pane -L 5
bind-key Right resize-pane -R 5
bind '"' split-window -c '#{pane_current_path}' -v
bind v split-window -c '#{pane_current_path}' -v
bind-key -n F3 split-window -c '#{pane_current_path}' -v
bind % split-window -c '#{pane_current_path}' -h
bind h split-window -c '#{pane_current_path}' -h
bind-key -n F4 split-window -c '#{pane_current_path}' -h
bind C new-window -c '#{pane_current_path}' -a
bind c new-window -c '#{pane_current_path}'
bind-key -n F5 new-window -c '#{pane_current_path}'
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1
bind b setw synchronize-panes off \; display 'Sync: OFF'
bind B setw synchronize-panes on \; display 'Sync: ON'
bind m set -g mouse off \; display 'Mouse: OFF'
bind M set -g mouse on \; display 'Mouse: ON'
bind C-z resize-pane -Z
bind-key W choose-tree -Zw "swap-window -t '%%'"
bind-key P choose-tree -Zw "swap-pane -t '%%'"
bind-key C-p choose-tree -Zw "move-pane -t '%%'"

# Use native clipboard/passthrough support instead of a plugin checkout.
set -g set-clipboard on
set -g allow-passthrough on
